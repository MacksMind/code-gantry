[project]
name = "refactor-orchestrator"
version = "0.1.0"
description = "Drives a multistage code refactor by pairing a local executor model with a paid reviewer model"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "openai>=1.60",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.120.2",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
