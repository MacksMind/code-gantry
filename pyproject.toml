[project]
name = "code-gantry"
version = "0.1.0"
description = "Drives a multistage code refactor by pairing an executor model with a paid reviewer model"
requires-python = ">=3.11"
authors = [{ name = "Mack Earnhardt", email = "mack@agilereasoning.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "openai>=1.60",
    "anthropic>=0.120.2",
]

[project.scripts]
code-gantry = "code_gantry.cli:main"

[dependency-groups]
# xdist because the suite is the inner loop of working on this codebase. Every
# test builds its own repository in a `tmp_path`, and the two that change
# directory do it through `monkeypatch`, so the state each worker touches is
# already per-test — the parallelism is safe because of how the fixtures were
# written, not by luck.
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_gantry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
